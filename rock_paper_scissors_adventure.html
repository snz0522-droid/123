<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪刀石頭布｜冒險者終極大對決</title>
<style>
:root{color-scheme:dark;--bg:#10172a;--panel:#1b2640;--gold:#ffd166;--text:#f4f7ff;--muted:#b9c4dd;--accent:#7c9cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#293b65 0,#10172a 55%);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:20px}
main{width:min(720px,100%);background:rgba(27,38,64,.94);border:1px solid #52658d;border-radius:24px;padding:clamp(20px,5vw,38px);box-shadow:0 24px 70px #0006}
h1{text-align:center;margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.5rem)}.subtitle{text-align:center;color:var(--muted);margin:0 0 26px}
label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #61739a;background:#10182b;color:white;font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.1);transform:translateY(-2px)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.primary{background:var(--gold);color:#20243a;width:100%;margin-top:18px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.choice{background:#34466d;color:white;font-size:1.2rem;padding:18px 8px}.choice span{display:block;font-size:2rem;margin-bottom:5px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.score div{background:#10182b;border-radius:14px;padding:15px;text-align:center}.score strong{display:block;font-size:2rem;color:var(--gold)}
.status{min-height:70px;background:#10182b;border-radius:14px;padding:16px;text-align:center;line-height:1.7;color:var(--muted)}
.hidden{display:none}.small{font-size:.9rem;color:var(--muted);text-align:center;margin-top:18px}
#restart{width:100%;background:var(--accent);color:#10172a;margin-top:14px}
@media(max-width:480px){.choices{gap:7px}.choice{font-size:1rem;padding:14px 4px}.choice span{font-size:1.7rem}}
</style>
</head>
<body>
<main>
<h1>✊✋✌️ 剪刀石頭布</h1>
<p class="subtitle">冒險者終極大對決｜先取得 3 勝，成為猜拳大師！</p>
<section id="login">
<label for="playerName">冒險者名字</label><input id="playerName" maxlength="30" placeholder="請輸入你的冒險者名字">
<label for="equipment">你的使用裝備</label><input id="equipment" maxlength="40" placeholder="例如：黃金鍵盤、魔法魔杖">
<button class="primary" id="start">開始冒險</button>
</section>
<section id="game" class="hidden">
<p id="welcome" class="status"></p>
<div class="score"><div>你<strong id="playerScore">0</strong>勝</div><div>電腦<strong id="computerScore">0</strong>勝</div></div>
<p id="round" class="small">第 1 回合</p>
<div class="choices">
<button class="choice" data-choice="剪刀"><span>✌️</span>剪刀</button>
<button class="choice" data-choice="石頭"><span>✊</span>石頭</button>
<button class="choice" data-choice="布"><span>✋</span>布</button>
</div>
<div id="status" class="status" aria-live="polite">請選擇你的出拳！</div>
<button id="restart" class="hidden">再玩一次</button>
</section>
<p class="small">遊戲規則：剪刀勝布、石頭勝剪刀、布勝石頭；平手不加分。</p>
</main>
<script>
const $=id=>document.getElementById(id);
const options=["剪刀","石頭","布"];
let player=0,computer=0,round=1,name="",equipment="";
$("start").addEventListener("click",()=>{
 name=$("playerName").value.trim(); equipment=$("equipment").value.trim();
 if(!name){$("playerName").focus();$("status").textContent="請先輸入冒險者名字！";return}
 if(!equipment){$("equipment").focus();$("status").textContent="請先選擇你的使用裝備！";return}
 player=computer=0;round=1;
 $("login").classList.add("hidden");$("game").classList.remove("hidden");$("restart").classList.add("hidden");
 $("welcome").textContent=`歡迎勇敢的冒險者【${name}】！你已裝備【${equipment}】，準備迎接猜拳挑戰！`;
 update();$("status").textContent="請選擇你的出拳！";
});
function update(){$("playerScore").textContent=player;$("computerScore").textContent=computer;$("round").textContent=`第 ${round} 回合`;}
document.querySelectorAll(".choice").forEach(btn=>btn.addEventListener("click",()=>{
 if(player>=3||computer>=3)return;
 const choice=btn.dataset.choice,enemy=options[Math.floor(Math.random()*options.length)];
 let result=`你出了【${choice}】，電腦出了【${enemy}】。`;
 if(choice===enemy)result+=" 平手！雙方都沒有得分。";
 else if((choice==="剪刀"&&enemy==="布")||(choice==="石頭"&&enemy==="剪刀")||(choice==="布"&&enemy==="石頭")){player++;result+=" 🎉 這回合你贏了！";}
 else{computer++;result+=" 💥 這回合電腦贏了！";}
 update();
 if(player===3||computer===3){
   result+=player===3?`\n🏆 恭喜 ${name} 以 ${player}：${computer} 擊敗電腦，成為猜拳大師！`:`\n💻 電腦以 ${computer}：${player} 獲得最終勝利，下次再來挑戰吧！`;
   document.querySelectorAll(".choice").forEach(b=>b.disabled=true);$("restart").classList.remove("hidden");
 }else{round++;update();result+=`\n目前戰況：你 ${player} 勝｜電腦 ${computer} 勝`;}
 $("status").textContent=result;
}));
$("restart").addEventListener("click",()=>{
 player=computer=0;round=1;update();$("status").textContent="新的一場冒險開始！請選擇你的出拳。";
 document.querySelectorAll(".choice").forEach(b=>b.disabled=false);$("restart").classList.add("hidden");
});
</script>
</body>
</html>
